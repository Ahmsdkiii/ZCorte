services:
  db:
    image: postgres:16-alpine
    container_name: zcorte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zcorte
      POSTGRES_PASSWORD: zcorte_dev_password
      POSTGRES_DB: zcorte_dev
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - zcorte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcorte -d zcorte_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: zcorte-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: zcorte
      POSTGRES_PASSWORD: zcorte_test_password
      POSTGRES_DB: zcorte_test
      TZ: Asia/Jakarta
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcorte -d zcorte_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zcorte_pgdata:
